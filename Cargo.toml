[package]
name = "g-space-analyzer"
version = "1.1.3"
edition = "2021"
rust-version = "1.80"
description = "G-SpaceAnalyzer - a fast, modern, free and open source disk space analyzer for Windows"
license = "MIT"
build = "build.rs"

[[bin]]
name = "G-SpaceAnalyzer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.29.1"
egui-phosphor = "0.7.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
trash = "5.2"
rfd = "0.14"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_Graphics_Dwm",
] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
