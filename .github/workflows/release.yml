name: Release

# Builds the app and the installer for every version tag, and attaches the
# installer to the GitHub release for that tag. Push a tag like v1.1.0 and the
# release appears with GSpaceAnalyzerSetup.exe on it.
#
# Can also be run by hand from the Actions tab: that only builds and stores the
# installer as a workflow artifact, it never publishes a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build GSpaceAnalyzerSetup.exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'Could not read the version from Cargo.toml.' }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Cargo.toml version: $version"

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = 'v${{ steps.version.outputs.version }}'
          if ($tag -ne $expected) {
            throw "Tag $tag does not match the Cargo.toml version (expected $expected). Bump the version before tagging."
          }
          Write-Host "Tag $tag matches version $expected."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build the release binary
        run: cargo build --release

      # Signing is optional and comes in two flavours.
      #
      # 1. SignPath Foundation (free for open source). The installer is submitted
      #    from this workflow and comes back signed. Enable it with one repository
      #    secret and one variable; the slug variables are optional overrides:
      #      secret   SIGNPATH_API_TOKEN
      #      variable SIGNPATH_ORGANIZATION_ID
      #      variable SIGNPATH_PROJECT_SLUG                 (default g-spaceanalyzer)
      #      variable SIGNPATH_SIGNING_POLICY_SLUG          (default release-signing)
      #      variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG  (default release-installer)
      #
      # 2. Your own certificate, used when CODESIGN_PFX is set:
      #      secret   CODESIGN_PFX          base64 of the .pfx
      #      secret   CODESIGN_PFX_PASSWORD its password
      #    Create the base64 with:
      #      [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))
      - name: Build the installer
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          $signArgs = @()
          if ($env:CODESIGN_PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            $signArgs = @('-PfxPath', $pfx, '-PfxPassword', $env:CODESIGN_PFX_PASSWORD)
            Write-Host 'Signing certificate supplied: the app and the setup will be signed.'
          } else {
            Write-Host 'No CODESIGN_PFX secret: building an unsigned installer.'
          }

          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File installer\build-installer.ps1 -SkipAppBuild @signArgs
            if ($LASTEXITCODE -ne 0) { throw 'The installer build failed.' }
          } finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }

          if (-not (Test-Path dist\GSpaceAnalyzerSetup.exe)) { throw 'The installer was not produced.' }
          $setup = Get-Item dist\GSpaceAnalyzerSetup.exe
          Write-Host ("Installer: {0} ({1:N2} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.SignerCertificate) {
            Write-Host ("Signature: {0} — {1}" -f $signature.Status, $signature.SignerCertificate.Subject)
          } else {
            Write-Host ("Signature: {0}" -f $signature.Status)
          }

      # SignPath signs the artifact it is handed, so the unsigned installer is
      # stored first and its id is passed to the signing request.
      - name: Store the installer as an artifact
        id: unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: GSpaceAnalyzerSetup-${{ steps.version.outputs.version }}
          path: dist/GSpaceAnalyzerSetup.exe
          if-no-files-found: error

      - name: Sign the installer with SignPath Foundation
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'g-spaceanalyzer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'release-installer' }}
          github-artifact-id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed

      - name: Use the signed installer
        if: steps.signpath.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed -Recurse -Filter GSpaceAnalyzerSetup.exe | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no signed installer.' }
          Copy-Item $signed.FullName dist\GSpaceAnalyzerSetup.exe -Force

          $signature = Get-AuthenticodeSignature dist\GSpaceAnalyzerSetup.exe
          if (-not $signature.SignerCertificate) { throw 'The installer came back unsigned.' }
          if ($signature.Status -eq 'HashMismatch') { throw 'The signed installer does not match its signature.' }
          Write-Host ("Signed installer: {0} - {1}" -f $signature.Status, $signature.SignerCertificate.Subject)

      - name: Store the signed installer as an artifact
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: GSpaceAnalyzerSetup-${{ steps.version.outputs.version }}-signed
          path: dist/GSpaceAnalyzerSetup.exe
          if-no-files-found: error

      - name: Create or update the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.version }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; replacing the installer attachment."
            gh release upload $tag dist\GSpaceAnalyzerSetup.exe --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag dist\GSpaceAnalyzerSetup.exe --title "G-SpaceAnalyzer $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
